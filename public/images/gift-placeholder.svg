<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="Gift placeholder">
  <!-- Box body -->
  <rect x="15" y="55" width="90" height="55" rx="3" fill="#f7f9f6" stroke="#556b2f" stroke-width="2"/>
  <!-- Lid -->
  <rect x="10" y="42" width="100" height="18" rx="3" fill="#f7f9f6" stroke="#556b2f" stroke-width="2"/>
  <!-- Vertical ribbon on box -->
  <rect x="54" y="55" width="12" height="55" fill="#556b2f" opacity="0.25"/>
  <!-- Vertical ribbon on lid -->
  <rect x="54" y="42" width="12" height="18" fill="#556b2f" opacity="0.4"/>
  <!-- Bow left loop -->
  <ellipse cx="42" cy="34" rx="16" ry="9" fill="#556b2f" opacity="0.35" transform="rotate(-20 42 34)"/>
  <!-- Bow right loop -->
  <ellipse cx="78" cy="34" rx="16" ry="9" fill="#556b2f" opacity="0.35" transform="rotate(20 78 34)"/>
  <!-- Bow center knot -->
  <circle cx="60" cy="38" r="7" fill="#556b2f" opacity="0.55"/>
</svg>
